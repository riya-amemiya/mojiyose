name: Bug report
description: Report incorrect encoding, decoding, or conversion
labels: ["bug"]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues
          required: true
  - type: dropdown
    id: encoding
    attributes:
      label: Encoding
      description: The encoding involved in the problem
      multiple: true
      options:
        - shift_jis
        - utf-8
        - utf-8-bom
        - euc-jp
        - iso-2022-jp
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mojiyose version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Browser
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or hex bytes that show the problem
      render: typescript
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/riya-amemiya/mojiyose/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
